name: dev_pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
    first-job:
        runs-on: ubuntu-latest
        steps:
            - name: code cloning
              uses: actions/checkout@v4
              
            - name: docker build
              working-directory: Exercise2
              run: docker build -t pipeline:v1 .

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.ACCESS_KEY }}
                aws-secret-access-key: ${{ secrets.SECRET }}
                aws-region: us-west-1

            - name: push docker image to ECR
              run: |
                 aws ecr get-login-password --region us-west-1 | docker login --username AWS --password-stdin 223249277559.dkr.ecr.us-west-1.amazonaws.com
                 docker tag pipeline:v1 223249277559.dkr.ecr.us-west-1.amazonaws.com/my-repo-b21:v1
                 docker push 223249277559.dkr.ecr.us-west-1.amazonaws.com/my-repo-b21:v1